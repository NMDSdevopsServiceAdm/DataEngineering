[project]
name = "dataengineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Achyut Ratkanthiwar", email = "achyut.ratkanthiwar@skillsforcare.org.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "black==26.1.0",
    "boto3==1.40.21",
    "numpy==2.3.2",
    "openpyxl==3.1.5",
    "pandas==2.3.2",
    "pointblank==0.13.1",
    "polars==1.38.1",
    "pydeequ==1.5.0",
    "pydoclint==0.6.11",
    "pyspark==3.5.4",
    "ratelimit==2.2.1",
    "requests==2.32.5",
    "scikit-learn==1.7.1",
    "urllib3==2.5.0",
    "css-inline==0.17.0",
]

[project.scripts]
dataengineering = "dataengineering:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "autopep8==2.3.2",
    "coverage==7.10.6",
    "ipykernel==6.30.1",
    "mock==5.2.0",
    "pre-commit==4.3.0",
    "pylint==3.3.8",
    "pytest==9.0.2",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.0.0",
    "pytest-watch==4.2.0",
    "moto==5.1.11",
    "pyarrow==21.0.0",
    "s3fs==0.4.2",
    "aws-mfa-v2",
]

[tool.uv]
python-preference = "only-managed"

[tool.pydoclint]
style = 'google'
