<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="Arial, Helvetica, sans-serif">
<title>Ticket 2155: two publication pipelines with a human pause between them</title>
<desc>Pipeline 1 starts when the filled posts estimates succeed: shared prep writes a store kept per run and the assessment task builds the review data. A human pause approves and selects a run. Pipeline 2 starts with that run number and builds the public data from the stored prep.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="450" fill="#FFFFFF"/>

<rect x="30" y="30" width="610" height="130" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text x="46" y="52" font-size="14" font-weight="500" fill="#2C2C2A">Pipeline 1: Publication-Assessment</text>

<rect x="44" y="70" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="114" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Estimates done</text>
<text x="114" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">EventBridge</text>

<rect x="214" y="70" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="304" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Shared prep</text>
<text x="304" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">merge + filter</text>

<rect x="424" y="70" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="524" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Assessment task</text>
<text x="524" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">review data</text>

<line x1="184" y1="98" x2="212" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="394" y1="98" x2="422" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="214" y="190" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="304" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Prep output store</text>
<text x="304" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">kept per run_number</text>
<line x1="304" y1="126" x2="304" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="424" y="190" width="200" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="524" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Human pause</text>
<text x="524" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">approve, then select run</text>
<line x1="524" y1="126" x2="524" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="30" y="270" width="610" height="130" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text x="46" y="292" font-size="14" font-weight="500" fill="#2C2C2A">Pipeline 2: Publication-Output</text>

<rect x="424" y="312" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="524" y="330" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Start with run_number</text>
<text x="524" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">required, set by hand</text>

<rect x="224" y="312" width="172" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="310" y="330" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Public task</text>
<text x="310" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">reads that run's prep</text>

<rect x="44" y="312" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="119" y="330" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Public data</text>
<text x="119" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">output + T0, T1, T2</text>

<line x1="524" y1="238" x2="524" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="424" y1="340" x2="398" y2="340" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="224" y1="340" x2="196" y2="340" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="304" y1="238" x2="304" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="44" y="424" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="64" y="431" dominant-baseline="central" font-size="12" fill="#444441">automated task</text>
<rect x="200" y="424" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="220" y="431" dominant-baseline="central" font-size="12" fill="#444441">human step</text>
<rect x="330" y="424" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="350" y="431" dominant-baseline="central" font-size="12" fill="#444441">trigger or data</text>
</svg>
