definitions:
  sheet: Definitions
  wrap: false
  widths:
  - 120
  - 38
  rows:
  - heading: Definitions
  - text: A filled post refers to any post (or job) currently filled by a person in a CQC-regulated independent sector adult social care location in England
  - blank: 2
  - heading: Rounding
  - text: Estimated filled post values have been rounded.
  - text: 'Information on our suppression and rounding rules can be found on the Workforce Intelligence website:'
  - url: https://www.skillsforcare.org.uk/Adult-Social-Care-Workforce-Data/Workforce-intelligence/about-us/Methodology.aspx
  - blank: 2
  - heading: Period
  - text: Period refers to months within the current financial year or end of March only before the current financial year.
  - blank: 2
  - heading: Main service
  - text: Skills for Care have allocated a main service to each CQC-regulated location based on their services offered on the CQC register.
  - text: A CQC-regulated location may offer multiple services, but Skills for Care have determined a main service to each of these.
  - text: The main service was determined in order of if the location offered 'Care home service with nursing' then 'Care only home'. Any other location was determined as 'CQC non-residential'.
  - blank: 2
  - heading: The following table explains the shorthand notations used throughout tables in this report;
  - text: '[x] data is not published in this report.'
  - text: '[s] fewer than 10 estimated filled posts. These values are suppressed, not rounded to zero.'
