introduction:
  sheet: Introduction
  widths:
  - 175
  rows:
  - heading: Introduction
  - text: This publication shows Skills for Care's estimated number of filled posts in independent CQC-regulated adult social care services.
  - text: The trends include changes due to locations opening and closing as well as changes at existing locations.
  - blank: 2
  - heading: Classification of Statistics
  - text: In 2023 Skills for Care became an official statistics provider, having been added to the Official Statistics Order 2023. This means that all official statistics provided by Skills for Care will include oversight from the Office for Statistics Regulation (OSR), ensuring it follows the Code of Practice for Statistics.
  - blank: 1
  - text: In July 2026, this publication was classified as an official statistic.
  - blank: 1
  - text: These statistics are published on the 15th of each month at 9:30am. Where the 15th falls on a weekend or England bank holiday, publication will take place on the next working day at 9:30am.
  - blank: 1
  - text: Revisions to this document can be found in the 'Revisions' tab.
  - blank: 2
  - heading: Methodology and data coverage
  - text: The estimates cover CQC-regulated independent sector adult social care services only.
  - text: 'For a description of how these figures were produced, please see ''Methodology: Monthly estimates of the size of the adult social care workforce''. Available at: '
  - url: https://www.skillsforcare.org.uk/Adult-Social-Care-Workforce-Data/workforceintelligence/Trackers/Filled-posts.aspx
  - blank: 1
  - text: Estimated figures are revised with each publication as additional data becomes available. As a result, estimates for previously published periods may change over time.
  - blank: 2
  - heading: Uses of the report
  - text: This publication may be of interest to members of the public, policy officials and other stakeholders to make local and national comparisons.
  - text: It is appropriate to use this publication when specifically thinking about the adult social care workforce employed by CQC-regulated independent sector services.
  - text: When discussing the whole adult social care sector workforce (including local authorities, independent providers not regulated by CQC, people working for direct payment recipients) this report should be looked at alongside other Skills for Care workforce intelligence reports.
  - blank: 2
  - heading: Useful links
  - link: Skills for Care's values and adoption of the Code of Practice for Statistics
    url: https://www.skillsforcare.org.uk/Adult-Social-Care-Workforce-Data/workforceintelligence/About-us/Compliance-with-the-Code-of-Practice-for-Statistics.aspx
