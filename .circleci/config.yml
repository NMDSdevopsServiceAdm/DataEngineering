version: 2.1

environment:
  AWS_REGION: eu-west-2

parameters:
  # These GitHub Actions params are expected by CircleCI even if unused.
  GHA_Actor:
    type: string
    default: ""
  GHA_Action:
    type: string
    default: ""
  GHA_Event:
    type: string
    default: ""
  GHA_Meta:
    type: string
    default: ""
  terraform_version:
    type: string
    default: 1.13.5

orbs:
  aws-cli: circleci/aws-cli@5.4.1

commands:
  export_sanitised_branch:
    description: "Compute the terraform-workspace-safe branch name into a file later steps in this job can source"
    parameters:
      branch_override:
        type: string
        default: ""
        description: >
          Only needed when CIRCLE_BRANCH isn't set normally (e.g.
          terraform-destroy, driven by a GitHub delete webhook). Passed via
          this step's environment: key rather than spliced into command:
          text -- pipeline parameters can contain shell metacharacters, and
          environment: values are never re-parsed as shell syntax.
    steps:
      - run:
          name: Compute sanitised branch name
          environment:
            RAW_BRANCH_OVERRIDE: << parameters.branch_override >>
          command: |
            # This transformation should match the workspace_prefix set in terraform/pipeline/main.tf locals block
            BRANCH="${RAW_BRANCH_OVERRIDE:-$CIRCLE_BRANCH}"
            SANITISED_CIRCLE_BRANCH=$(echo ${BRANCH:0:30} | tr -c "[:alnum:]\n" "-" | tr "[:upper:]" "[:lower:]")
            echo "export SANITISED_CIRCLE_BRANCH=${SANITISED_CIRCLE_BRANCH}" > /tmp/sanitised_branch.env

  initialise_terraform:
    description: "Set up the terraform backend for terraform jobs"
    steps:
      - export_sanitised_branch
      - run:
          name: Initialise terraform
          command: |
            # UNSET old keys to force AWS CLI to use OIDC
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            . /tmp/sanitised_branch.env
            cd terraform/pipeline
            terraform init -input=false -backend-config=../${AWS_ENV}.s3.tfbackend
            terraform workspace select ${SANITISED_CIRCLE_BRANCH} || terraform workspace new ${SANITISED_CIRCLE_BRANCH}


jobs:
  # Works out which docker-bake targets this push needs, so
  # task-containerisation can skip setup_remote_docker entirely when nothing
  # changed, and whether this push should seed the non-prod raw data bucket,
  # so copy-main-data can skip triggering the ingest Step Functions for
  # branches unrelated to ingest. Separate job because docker:latest has no
  # python.
  decide-bake-and-seed:
    docker:
      # cimg over the lint jobs' uv image: this job needs git, which that
      # image lacks, and only needs boto3 so the fuller env buys nothing.
      - image: cimg/python:3.11.12
    resource_class: small
    environment:
      AWS_REGION: eu-west-2
    steps:
      - checkout
      - run:
          name: Fetch main
          command: |
            # The merge-base diff needs main's history, which checkout may not
            # have fetched.
            if [ -f .git/shallow ]; then
              git fetch --unshallow origin
            fi
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - export_sanitised_branch
      - run:
          name: Install dependencies
          command: pip install boto3==1.40.21
      - run:
          name: Select bake targets
          command: |
            # UNSET old keys to force botocore to use OIDC. Without this it
            # authenticates with the context's static keys, which reach a
            # different account and report every repository as missing.
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            # botocore assumes the role from these directly, so this job doesn't
            # need the aws-cli orb just to read one ECR tag.
            echo "$CIRCLE_OIDC_TOKEN_V2" > /tmp/oidc-token
            export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc-token
            export AWS_ROLE_SESSION_NAME=decide-bake-and-seed
            . /tmp/sanitised_branch.env
            mkdir -p /tmp/bake
            python scripts/select_bake_targets.py > /tmp/bake/targets
            echo "Targets to build: $(cat /tmp/bake/targets)"
      - run:
          name: Decide whether to seed the raw bucket
          command: |
            mkdir -p /tmp/bake
            python scripts/select_raw_bucket_seed.py > /tmp/bake/seed-raw-bucket
            echo "Seed raw bucket: $(cat /tmp/bake/seed-raw-bucket)"
      - persist_to_workspace:
          # Namespaced, because later jobs attach this same workspace at the
          # repo root and a bare "targets" file there reads as repo content.
          root: /tmp
          paths:
            - bake/targets
            - bake/seed-raw-bucket

  task-containerisation:
    parameters:
      select_targets:
        type: boolean
        default: false
        description: >
          Dev only. Use decide-bake-and-seed's target list, skipping the build when
          nothing relevant changed. Main always bakes every target, because a
          merge-base diff against main is empty by definition there.
    docker:
      - image: docker:latest
    steps:
      - checkout
      - export_sanitised_branch
      - when:
          condition: << parameters.select_targets >>
          steps:
            - attach_workspace:
                at: /tmp
            - run:
                name: Skip build if no image needs rebuilding
                command: |
                  # Must run before setup_remote_docker, or halting saves nothing.
                  # Checks content not size -- an empty result is still 1 byte.
                  # Missing-file case can't fire today (decide-bake-and-seed is a hard
                  # requirement here) -- kept as a defensive fallback that builds
                  # everything rather than silently building nothing.
                  if [ ! -f /tmp/bake/targets ]; then
                    echo "No target list found. Building every target."
                  elif [ -z "$(cat /tmp/bake/targets)" ]; then
                    echo "No docker build context changed and every image is already in ECR. Skipping build."
                    circleci-agent step halt
                  fi
      - setup_remote_docker
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION
      - run:
          name: Build Docker Images
          command: |
            # UNSET old keys to force AWS CLI to use OIDC
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            # Authenticate Docker to ECR
            aws ecr get-login-password --region eu-west-2 | docker login -u AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.eu-west-2.amazonaws.com
            echo "Rebuilding lambdas and pushing to ECR."
            . /tmp/sanitised_branch.env
            # No target list (main, or an absent file) means build everything.
            BAKE_TARGETS=$(cat /tmp/bake/targets 2>/dev/null || echo all)
            docker buildx bake $BAKE_TARGETS --push

  test:
    docker:
      - image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    resource_class: large
    environment:
      SPARK_VERSION: "3.5"       # Required for pydeequ to initialize
    steps:
      - checkout
      - run:
          name: Install system packages
          command: |
            apt-get update
            apt-get install -y default-jre-headless
      - restore_cache:
          keys:
            - v1-test-deps-{{ checksum "uv.lock" }}
      - run:
          name: install dependencies
          command: uv sync --locked
      # Runs the selector's CLI against the repo's real bake file and
      # Dockerfiles. The unit tests cover the selection logic; this covers main()
      # and catches a bake file or Dockerfile edit the parser can't read, which
      # would otherwise only surface in decide-bake-and-seed on somebody's next push.
      # --skip-ecr-check because this job has no AWS credentials.
      - run:
          name: Smoke test bake target selection
          command: |
            SELECTED=$(uv run python scripts/select_bake_targets.py \
              --skip-ecr-check \
              --changed-path docker_requirements/requirements.txt)
            echo "Selected: ${SELECTED}"
            if [ -z "${SELECTED}" ]; then
              echo "Every image installs docker_requirements/requirements.txt, so a change to it must select every target." >&2
              exit 1
            fi
      # Download the pydeequ dependency and configure.
      - run:
            name: Fetch Spark JARs
            command: uv run python scripts/fetch_spark_dependencies.py
      - save_cache:
          key: v1-test-deps-{{ checksum "uv.lock" }}
          paths:
            - /root/.cache/uv
            - /root/.ivy2
      - run:
          name: Run unit tests and generate coverage
          command: |
            uv run pytest \
              -n auto --dist loadfile \
              --ignore=tests/integration/test_cqc_api_integration.py \
              --cov=. \
              --cov-report=xml \
              --cov-report=html
      - run:
            name: Output Coverage Report
            command: uv run coverage report

  # Hits the live CQC API directly (no mocking), so it can fail purely from a
  # CQC-side outage. Split out from `test` and not `requires:`-gated by
  # anything, so an unhandled failure here can't block terraform-plan/apply.
  test-cqc-integration:
    docker:
      - image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-test-deps-{{ checksum "uv.lock" }}
      - run:
          name: install dependencies
          command: uv sync --locked
      - run:
          name: Run CQC API integration tests
          command: uv run pytest tests/integration/test_cqc_api_integration.py -v

  lint-python:
    docker:
      - image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install lint tools
          command: uv sync --locked
      - run:
          name: Check Python formatting
          command: uvx black@25.1.0 . --check

  lint-docstrings:
    docker:
      - image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install lint tools
          command: uv sync --locked
      - run:
          name: Check docstring formatting
          command: uvx pydoclint --style=google --quiet .

  lint-terraform:
    docker:
      - image: docker.mirror.hashicorp.services/hashicorp/terraform:<< pipeline.parameters.terraform_version >>
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check terraform formatting
          command: terraform fmt -check -recursive -diff

  terraform-plan:
    working_directory: /tmp/project
    docker:
      - image: docker.mirror.hashicorp.services/hashicorp/terraform:<< pipeline.parameters.terraform_version >>
    resource_class: small
    steps:
      - checkout
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION
      - initialise_terraform
      - run:
          name: terraform plan
          command: |
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            cd terraform/pipeline
            terraform plan -out tfplan
      - store_artifacts:
          path: terraform/pipeline/tfplan
      - persist_to_workspace:
          root: .
          paths:
            # The workspace is intentionally limited to the Terraform plan file plus dependency folders to reduce CircleCI storage costs
            # Needed for terraform apply step
            - terraform/pipeline/tfplan
            - lambdas
            # Needed for deploy-dependencies step
            - utils
            - schemas
            - projects
            - environment
            - polars_utils


  terraform-apply:
    docker:
      - image: docker.mirror.hashicorp.services/hashicorp/terraform:<< pipeline.parameters.terraform_version >>
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION
      - initialise_terraform # Reinitialising terraform to reduce cost of persisting .terraform folder in workspace
      - run:
          name: terraform apply
          command: |
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            cd terraform/pipeline
            terraform apply -auto-approve tfplan
      - run:
          name: save pipeline resources bucket name
          command: |
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            cd terraform/pipeline
            echo $(terraform output --raw pipeline_resources_bucket_name) > pipeline_resources_bucket_name
      - run:
          name: save datasets bucket name
          command: |
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            cd terraform/pipeline
            echo $(terraform output --raw datasets_bucket_name) > datasets_bucket_name
      - run:
          name: save raw bucket name
          command: |
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            cd terraform/pipeline
            echo $(terraform output --raw raw_bucket_name) > raw_bucket_name
      - persist_to_workspace:
          root: .
          paths:
            - ./terraform/pipeline/pipeline_resources_bucket_name
            - ./terraform/pipeline/datasets_bucket_name
            - ./terraform/pipeline/raw_bucket_name

  deploy-dependencies:
    docker:
      - image: cimg/python:3.11.12
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION
      - run:
          name: package utils, schemas, projects and environment
          command: |
            mkdir dependencies && zip -r dependencies/dependencies.zip utils schemas projects environment polars_utils
      - run:
          name: Download Deequ jar
          command: |
            wget https://repo1.maven.org/maven2/com/amazon/deequ/deequ/2.0.8-spark-3.5/deequ-2.0.8-spark-3.5.jar -O dependencies/deequ-2.0.8-spark-3.5.jar
      - run:
          name: Install uv
          command: pip install -U uv
      - run:
          name: Package PyDeequ
          command: |
            uv pip install --target ./target pydeequ==1.5.0
            cd target && zip -r pydeequ-1.5.0.zip pydeequ && cd ..
            mv target/pydeequ-1.5.0.zip dependencies/pydeequ-1.5.0.zip
            rm -rf target
      - run:
          name: Sync dependencies to S3
          command: |
            PIPELINE_RESOURCES=$(cat terraform/pipeline/pipeline_resources_bucket_name)
            aws s3 sync dependencies "s3://$PIPELINE_RESOURCES/dependencies"

  copy-main-data:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION
      - run:
          name: Setup Environment Variables
          command: |
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            echo 'export BRANCH_DATASET_BUCKET=$(cat terraform/pipeline/datasets_bucket_name)' >> "$BASH_ENV"
            echo 'export BRANCH_RESOURCES_BUCKET=$(cat terraform/pipeline/pipeline_resources_bucket_name)' >> "$BASH_ENV"
            echo 'export BRANCH_RAW_BUCKET=$(cat terraform/pipeline/raw_bucket_name)' >> "$BASH_ENV"
      - run:
          name: Copy main datasets to non-prod dataset bucket
          command: |
            aws s3 sync "s3://sfc-main-datasets/domain=CQC/dataset=cqc_locations_04_full_cleaned_registered/" "s3://$BRANCH_DATASET_BUCKET/domain=CQC/dataset=cqc_locations_04_full_cleaned_registered/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=CQC/dataset=postcode_corrections/" "s3://$BRANCH_DATASET_BUCKET/domain=CQC/dataset=postcode_corrections/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=ONS/dataset=postcode_directory_cleaned/" "s3://$BRANCH_DATASET_BUCKET/domain=ONS/dataset=postcode_directory_cleaned/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=ASCWDS/dataset=workplace/" "s3://$BRANCH_DATASET_BUCKET/domain=ASCWDS/dataset=workplace/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=ASCWDS/dataset=worker/" "s3://$BRANCH_DATASET_BUCKET/domain=ASCWDS/dataset=worker/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=ASCWDS/dataset=workplace_cleaned/" "s3://$BRANCH_DATASET_BUCKET/domain=ASCWDS/dataset=workplace_cleaned/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=ASCWDS/dataset=worker_cleaned/" "s3://$BRANCH_DATASET_BUCKET/domain=ASCWDS/dataset=worker_cleaned/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=ASCWDS/dataset=data_labels/" "s3://$BRANCH_DATASET_BUCKET/domain=ASCWDS/dataset=data_labels/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=capacity_tracker/dataset=capacity_tracker_care_home_cleaned/" "s3://$BRANCH_DATASET_BUCKET/domain=capacity_tracker/dataset=capacity_tracker_care_home_cleaned/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=capacity_tracker/dataset=capacity_tracker_non_residential_cleaned/" "s3://$BRANCH_DATASET_BUCKET/domain=capacity_tracker/dataset=capacity_tracker_non_residential_cleaned/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=CQC/dataset=pir_cleaned/" "s3://$BRANCH_DATASET_BUCKET/domain=CQC/dataset=pir_cleaned/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=ind_cqc_filled_posts/dataset=ind_cqc_06_estimated_filled_posts/" "s3://$BRANCH_DATASET_BUCKET/domain=ind_cqc_filled_posts/dataset=main_ind_cqc_06_estimated_filled_posts/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=ind_cqc_filled_posts/dataset=ind_cqc_07_04_estimate_job_roles/" "s3://$BRANCH_DATASET_BUCKET/domain=ind_cqc_filled_posts/dataset=main_ind_cqc_07_04_estimate_job_roles/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=ind_cqc_filled_posts/dataset=ind_cqc_07_01_merge_metadata_job_roles/" "s3://$BRANCH_DATASET_BUCKET/domain=ind_cqc_filled_posts/dataset=main_ind_cqc_07_01_merge_metadata_job_roles/" --delete
            aws s3 sync "s3://sfc-main-datasets/domain=workforce_characteristics/dataset=empstat_rates/" "s3://$BRANCH_DATASET_BUCKET/domain=workforce_characteristics/dataset=empstat_rates/" --delete
      - run:
          name: Copy models to non-prod dataset
          command: |
            aws s3 sync "s3://sfc-main-pipeline-resources/models/" "s3://$BRANCH_RESOURCES_BUCKET/models/"
      - run:
          name: Seed non-prod raw bucket from sample bucket
          command: |
            # Defaults to seeding when the flag file is missing/unreadable --
            # same defensive direction as decide-bake-and-seed's own missing-file
            # fallback (build everything rather than silently building
            # nothing): here, seed anyway rather than silently never testing
            # a real ingest change.
            if [ "$(cat bake/seed-raw-bucket 2>/dev/null)" = "false" ]; then
              echo "No ingest-related changes detected. Skipping raw bucket seed."
            else
              aws s3 sync "s3://sfc-main-sample-raw-data/" "s3://$BRANCH_RAW_BUCKET/" --delete
            fi

  terraform-destroy:
    working_directory: /tmp/project
    docker:
      - image: docker.mirror.hashicorp.services/hashicorp/terraform:<< pipeline.parameters.terraform_version >>
    resource_class: small
    steps:
      - checkout
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION
      # Runs off a GitHub delete webhook via pipeline parameters, not a
      # normal push, so CIRCLE_BRANCH isn't set -- GHA_Meta carries it instead.
      - export_sanitised_branch:
          branch_override: << pipeline.parameters.GHA_Meta >>
      - run:
          name: terraform destroy
          command: |
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            . /tmp/sanitised_branch.env
            # --- Safeguard to never destroy main ---
            if [ "$SANITISED_CIRCLE_BRANCH" = "main" ]; then
              echo "Skipping destroy for main branch"
              exit 0
            fi
            # --- Select workspace ---
            cd terraform/pipeline
            terraform init -input=false -backend-config=../non_prod.s3.tfbackend
            terraform workspace select ${SANITISED_CIRCLE_BRANCH}
            # --- Run destroy ---
            # Terraform will now automatically empty the bucket because of force_destroy = true
            terraform destroy -auto-approve
      - run:
          name: delete workspace
          command: |
            unset AWS_ACCESS_KEY_ID
            unset AWS_SECRET_ACCESS_KEY
            . /tmp/sanitised_branch.env
            cd terraform/pipeline
            terraform workspace select default
            terraform workspace delete ${SANITISED_CIRCLE_BRANCH}


workflows:
  test-plan-approve-and-deploy-to-main:
    unless: << pipeline.parameters.GHA_Action >>
    jobs:
      - task-containerisation:
          context: prod
          filters:
            branches:
              only: main
      - test:
          filters:
            branches:
              only: main
      - test-cqc-integration:
          filters:
            branches:
              only: main
      - terraform-plan:
          context: prod
          requires:
            - test
            - task-containerisation
      - plan-approval:
          type: approval
          requires:
            - terraform-plan
      - terraform-apply:
          context: prod
          requires:
            - plan-approval
      - deploy-dependencies:
          context: prod
          requires:
            - terraform-apply


  test-plan-and-deploy-to-dev:
    unless: << pipeline.parameters.GHA_Action >>
    jobs:
      - decide-bake-and-seed:
          context: non-prod
          filters:
            branches:
              ignore: main
      - task-containerisation:
          context: non-prod
          select_targets: true
          requires:
            - decide-bake-and-seed
          filters:
            branches:
              ignore: main
      - lint-python:
          filters:
            branches:
              ignore: main
      - lint-terraform:
          filters:
            branches:
              ignore: main
      - lint-docstrings:
          filters:
            branches:
              ignore: main
      - terraform-plan:
          context: non-prod
          requires:
            - lint-terraform
            - task-containerisation
      - terraform-apply:
          context: non-prod
          requires:
            - terraform-plan
      - deploy-dependencies:
          context: non-prod
          requires:
            - terraform-apply
      - copy-main-data:
          context: non-prod
          requires:
            - terraform-apply
            - decide-bake-and-seed
          filters:
            branches:
              ignore: main
      - test:
          requires:
            - terraform-apply
          filters:
            branches:
              ignore: main
      - test-cqc-integration:
          filters:
            branches:
              ignore: main

  delete-development-environment:
    when: << pipeline.parameters.GHA_Action >>
    jobs:
      - terraform-destroy:
          context: non-prod
